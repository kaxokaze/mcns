<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070707" />
  <title>Work in Progress — kaxokaze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --fg: #f6f5f2;
      --muted: #898989;
      --accent: #d9ff3f;
      --accent-2: #7c4dff;
      --glass: rgba(255,255,255,.055);
      --line: rgba(255,255,255,.1);
      --mx: 50vw;
      --my: 50vh;
      --rx: 0deg;
      --ry: 0deg;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "DM Sans", system-ui, sans-serif;
      cursor: crosshair;
    }

    a { color: inherit; text-decoration: none; }

    .scene {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 18%, rgba(124,77,255,.13), transparent 25%),
        radial-gradient(circle at 83% 72%, rgba(217,255,63,.09), transparent 27%),
        #050505;
    }

    .grid {
      position: absolute;
      inset: -20%;
      opacity: .3;
      transform: perspective(800px) rotateX(60deg) translateY(14%);
      transform-origin: center bottom;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 35%, black 78%, transparent 100%);
      animation: drift 18s linear infinite;
      z-index: -3;
    }

    .noise {
      position: absolute;
      inset: 0;
      opacity: .065;
      z-index: 8;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    .orb {
      position: absolute;
      width: 42vmax;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .13;
      z-index: -2;
      will-change: transform;
    }
    .orb.one {
      top: -18vmax;
      left: -12vmax;
      background: #7c4dff;
      animation: floatA 10s ease-in-out infinite;
    }
    .orb.two {
      right: -19vmax;
      bottom: -16vmax;
      background: #d9ff3f;
      animation: floatB 12s ease-in-out infinite;
    }

    .cursor-glow {
      position: absolute;
      width: 34vmax;
      height: 34vmax;
      left: calc(var(--mx) - 17vmax);
      top: calc(var(--my) - 17vmax);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.075), transparent 62%);
      filter: blur(10px);
      pointer-events: none;
      z-index: -1;
      transition: left .18s ease-out, top .18s ease-out;
    }

    main {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 30px;
      perspective: 1600px;
    }

    .stack {
      width: min(900px, 92vw);
      text-align: center;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform .16s ease-out;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      backdrop-filter: blur(14px);
      border-radius: 999px;
      color: #c8c8c8;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      box-shadow: 0 0 0 1px rgba(255,255,255,.015) inset;
      animation: rise .8s cubic-bezier(.2,.9,.2,1) both;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(217,255,63,.9);
      animation: pulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 28px 0 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(4.5rem, 13vw, 10.5rem);
      line-height: .82;
      letter-spacing: -.075em;
      font-weight: 700;
      text-transform: uppercase;
      transform: translateZ(60px);
      animation: rise 1s .08s cubic-bezier(.2,.9,.2,1) both;
    }

    h1 span {
      display: inline-block;
      background: linear-gradient(100deg, #fff 10%, #c9c9c9 38%, #fff 62%, #9b9b9b 86%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 230% auto;
      animation: shine 5s linear infinite;
    }

    .sub {
      margin: 28px auto 0;
      max-width: 610px;
      color: var(--muted);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.65;
      transform: translateZ(35px);
      animation: rise 1s .16s cubic-bezier(.2,.9,.2,1) both;
    }

    .social-wrap {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      transform: translateZ(40px);
      animation: rise 1s .24s cubic-bezier(.2,.9,.2,1) both;
    }

    .social {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 13px;
      min-width: 225px;
      justify-content: center;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 15px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 16px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(16px);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .social::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(120deg, transparent 24%, rgba(217,255,63,.55), transparent 50%, rgba(124,77,255,.5), transparent 76%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: .6;
    }

    .social:hover {
      transform: translateY(-4px) scale(1.025);
      border-color: rgba(217,255,63,.32);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.11), 0 22px 70px rgba(0,0,0,.46), 0 0 40px rgba(217,255,63,.08);
    }

    .github-mark { width: 19px; height: 19px; opacity: .95; }
    .handle { font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .arrow { color: var(--accent); font-size: 16px; transition: transform .25s ease; }
    .social:hover .arrow { transform: translate(3px,-3px); }

    .tiny {
      margin-top: 32px;
      font-size: 11px;
      color: #515151;
      letter-spacing: .23em;
      text-transform: uppercase;
      animation: flicker 4s ease-in-out infinite;
    }

    .shape {
      position: absolute;
      border: 1px solid rgba(255,255,255,.09);
      background: linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.01));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.3);
      backdrop-filter: blur(7px);
      z-index: -1;
    }
    .shape.a {
      width: 130px; height: 130px;
      right: 9vw; top: 15vh;
      border-radius: 30px;
      transform: rotate(24deg);
      animation: shapeA 8s ease-in-out infinite;
    }
    .shape.b {
      width: 78px; height: 78px;
      left: 10vw; bottom: 16vh;
      border-radius: 50%;
      animation: shapeB 7s ease-in-out infinite;
    }
    .shape.c {
      width: 170px; height: 1px;
      left: 8vw; top: 28vh;
      border: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      box-shadow: none;
      animation: scan 3.8s ease-in-out infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) translateZ(0); }
      to { opacity: 1; transform: translateY(0) translateZ(0); }
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.65); opacity: .55; } }
    @keyframes shine { from { background-position: 200% center; } to { background-position: -40% center; } }
    @keyframes drift { from { background-position: 0 0; } to { background-position: 52px 52px; } }
    @keyframes floatA { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(4vw, 3vh, 0) scale(1.06); } }
    @keyframes floatB { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(-4vw, -2vh, 0) scale(.96); } }
    @keyframes shapeA { 0%,100% { transform: rotate(24deg) translateY(0); } 50% { transform: rotate(34deg) translateY(-18px); } }
    @keyframes shapeB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(16px,-22px); } }
    @keyframes scan { 0%,100% { opacity: .15; transform: translateX(0); } 50% { opacity: .55; transform: translateX(26px); } }
    @keyframes flicker { 0%, 100% { opacity: .55; } 45% { opacity: .55; } 48% { opacity: .2; } 50% { opacity: .6; } 52% { opacity: .24; } 55% { opacity: .55; } }

    @media (max-width: 700px) {
      body { cursor: default; }
      main { padding: 18px; }
      .shape.a { right: -35px; top: 10vh; width: 95px; height: 95px; }
      .shape.b { left: -15px; bottom: 14vh; width: 55px; height: 55px; }
      .shape.c { left: 0; top: 25vh; width: 110px; }
      .sub { max-width: 330px; }
      .social { min-width: 205px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="grid"></div>
    <div class="noise"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="cursor-glow"></div>
    <div class="shape a"></div>
    <div class="shape b"></div>
    <div class="shape c"></div>

    <main>
      <section class="stack" aria-label="Work in progress">
        <div class="eyebrow"><span class="dot"></span> currently building</div>
        <h1><span>work in<br>progress</span></h1>
        <p class="sub">Something new is being built in the background.<br>Come back when it’s ready.</p>

        <div class="social-wrap">
          <a class="social" href="https://github.com/kaxokaze" target="_blank" rel="noopener noreferrer" aria-label="Visit kaxokaze on GitHub">
            <svg class="github-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2C6.477 2 2 6.585 2 12.24c0 4.526 2.865 8.364 6.839 9.72.5.095.683-.222.683-.495 0-.244-.009-.89-.014-1.748-2.782.62-3.369-1.374-3.369-1.374-.455-1.183-1.11-1.498-1.11-1.498-.907-.635.069-.622.069-.622 1.003.073 1.531 1.058 1.531 1.058.892 1.565 2.341 1.113 2.912.851.091-.663.349-1.113.635-1.369-2.221-.26-4.555-1.14-4.555-5.07 0-1.12.39-2.035 1.029-2.753-.103-.26-.446-1.304.098-2.718 0 0 .839-.275 2.75 1.052A9.23 9.23 0 0 1 12 7.03a9.1 9.1 0 0 1 2.503.354c1.91-1.327 2.748-1.052 2.748-1.052.545 1.414.202 2.458.099 2.718.64.718 1.028 1.633 1.028 2.753 0 3.94-2.338 4.807-4.566 5.062.359.318.678.944.678 1.904 0 1.374-.012 2.48-.012 2.816 0 .276.18.595.69.494C19.138 20.6 22 16.764 22 12.24 22 6.585 17.523 2 12 2Z" fill="currentColor"/>
            </svg>
            <span class="handle">github.com/kaxokaze</span>
            <span class="arrow">↗</span>
          </a>
        </div>

        <div class="tiny">page is still under construction</div>
      </section>
    </main>
  </div>

  <script>
    const root = document.documentElement;
    const stack = document.querySelector('.stack');

    window.addEventListener('pointermove', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      root.style.setProperty('--mx', `${x}px`);
      root.style.setProperty('--my', `${y}px`);

      const dx = (x / window.innerWidth - 0.5) * 2;
      const dy = (y / window.innerHeight - 0.5) * 2;
      root.style.setProperty('--ry', `${dx * 3.8}deg`);
      root.style.setProperty('--rx', `${dy * -3.8}deg`);
    }, { passive: true });

    window.addEventListener('pointerleave', () => {
      root.style.setProperty('--rx', '0deg');
      root.style.setProperty('--ry', '0deg');
    });

    // Tiny parallax without any library.
    window.addEventListener('deviceorientation', (event) => {
      if (typeof event.gamma !== 'number' || typeof event.beta !== 'number') return;
      const ry = Math.max(-3.5, Math.min(3.5, event.gamma / 10));
      const rx = Math.max(-3.5, Math.min(3.5, (event.beta - 45) / -10));
      root.style.setProperty('--ry', `${ry}deg`);
      root.style.setProperty('--rx', `${rx}deg`);
    }, { passive: true });
  </script>
</body>
</html>
